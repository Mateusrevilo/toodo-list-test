name: Pipeline CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Rodar build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Vincular projeto Vercel
        id: vercel-link
        continue-on-error: true
        run: |
          # Vincular projeto usando Project ID se disponível
          if [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "📦 Vinculando projeto Vercel: ${{ secrets.VERCEL_PROJECT_ID }}"
            vercel link --yes --token="${{ secrets.VERCEL_TOKEN }}" \
              --project="${{ secrets.VERCEL_PROJECT_ID }}" \
              --scope="${{ secrets.VERCEL_ORG_ID }}" && {
              echo "linked=true" >> $GITHUB_OUTPUT
              echo "✅ Projeto vinculado com sucesso"
            } || {
              echo "linked=false" >> $GITHUB_OUTPUT
              echo "⚠️ Não foi possível vincular projeto. Vercel detectará automaticamente."
            }
          else
            echo "linked=false" >> $GITHUB_OUTPUT
            echo "ℹ️ VERCEL_PROJECT_ID ou VERCEL_ORG_ID não configurados"
            echo "ℹ️ Vercel detectará projeto automaticamente baseado no repositório Git"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy para Vercel (produção)
        id: deploy
        run: |
          echo "🚀 Fazendo deploy para produção..."
          vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
          echo "✅ Deploy concluído com sucesso!"
