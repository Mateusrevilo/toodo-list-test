name: Pipeline CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Rodar build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy para Vercel (produção)
        id: deploy
        run: |
          # Configurar projeto vinculado se as secrets estiverem disponíveis
          if [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_ORG_ID" ]; then
            echo "📦 Configurando projeto Vercel: $VERCEL_PROJECT_ID"
            mkdir -p .vercel
            echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          fi
          
          # Fazer deploy para produção
          # Se o projeto não existir, o Vercel CLI detectará automaticamente baseado no repositório Git
          echo "🚀 Fazendo deploy para produção..."
          vercel deploy --prod --yes --token=$VERCEL_TOKEN || {
            EXIT_CODE=$?
            if [ -f .vercel/project.json ]; then
              echo "⚠️ Deploy falhou. Removendo configuração de projeto e tentando novamente..."
              rm -rf .vercel
              echo "🔄 Tentando deploy sem vinculação (Vercel detectará projeto automaticamente)"
              vercel deploy --prod --yes --token=$VERCEL_TOKEN
            else
              exit $EXIT_CODE
            fi
          }
          echo "✅ Deploy concluído com sucesso!"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
