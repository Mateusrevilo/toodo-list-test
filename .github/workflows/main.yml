name: Pipeline CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Rodar build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy para Vercel (produção)
        id: deploy
        run: |
          # O Vercel CLI detecta automaticamente projetos vinculados ao repositório Git
          # Não precisamos configurar VERCEL_PROJECT_ID ou VERCEL_ORG_ID manualmente
          # O Vercel usa a integração Git para identificar o projeto correto
          echo "🚀 Fazendo deploy para produção..."
          echo "ℹ️ Vercel detectará automaticamente o projeto baseado no repositório Git"
          vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
          echo "✅ Deploy concluído com sucesso!"
